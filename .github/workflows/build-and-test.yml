name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The job id is the status-check name that branch protection requires on main.
  build-and-test:
    runs-on: ubuntu-latest

    services:
      # Mirrors docker-compose.yml so the API tests' connection string works unchanged.
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Workshop!Passw0rd"
        ports:
          - 14330:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Workshop!Passw0rd' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Helpdesk.slnx

      - name: Test
        run: dotnet test Helpdesk.slnx --no-build
