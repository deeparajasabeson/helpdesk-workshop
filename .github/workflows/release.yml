name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish-image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Build and push ghcr.io/<owner>/helpdesk
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.ref_name }}
        run: |
          # ghcr.io rejects image names with uppercase letters.
          image="ghcr.io/${OWNER,,}/helpdesk"
          docker build --tag "$image:$TAG" --tag "$image:latest" .
          docker push "$image:$TAG"
          docker push "$image:latest"
